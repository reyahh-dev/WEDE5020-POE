<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Page Title -->
    <title>Make an Enquiry | Rea's Bakery – Pretoria</title>

    <!-- SEO Meta Description -->
    <meta name="description" content="Make an enquiry at Rea's Bakery in Pretoria about fresh bread, pastries, custom cakes, wedding cakes, bulk orders and catering services.">

    <!-- SEO Keywords -->
    <meta name="keywords" content="Rea's Bakery enquiry, bakery Pretoria, custom cake enquiries, wedding cake orders, bulk bakery orders, catering enquiries">

    <!-- Website Author -->
    <meta name="author" content="Rea's Bakery">

    <!-- External CSS -->
    <link rel="stylesheet" href="_css/style.css">
</head>


<body>

    <!-- Website header -->
    <header>
        <div class="header-container">

            <a href="index.html" class="logo">
                <img src="_images/Logo.jpg" alt="Rea's Bakery Logo">
            </a>

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="enquiry.html">Enquiry</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <main>

        <!-- Page introduction -->
        <section class="page-header">
            <h1>Make an Enquiry</h1>

            <p>
                Interested in our products or services?
                Complete the form below and tell us what you need.
            </p>
        </section>

        <!-- Enquiry form -->
        <section class="section">

            <div class="form-container">

                <form id="enquiryForm">

                    <fieldset>

                        <legend>Customer Information</legend>

                        <label for="fullName">Full Name:</label>
                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            minlength="2"
                            maxlength="60"
                            required
                        >

                        <label for="email">Email Address:</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >

                        <label for="phone">Telephone Number:</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            pattern="(\+27|0)[1-9][0-9]{8}"
                            title="Enter a valid South African number, for example 0821234567 or +27821234567."
                            placeholder="0821234567"
                            required
                        >

                    </fieldset>

                    <fieldset>

                        <legend>Enquiry Details</legend>

                        <label for="enquiryType">Type of Enquiry:</label>

                        <select id="enquiryType" name="enquiryType" required>

                            <option value="">Select an option</option>
                            <option value="Product Availability">Product Availability</option>
                            <option value="Custom Cake">Custom Cake</option>
                            <option value="Bulk Order">Bulk Order</option>
                            <option value="Wedding Cake">Wedding Cake</option>
                            <option value="Catering">Catering</option>

                        </select>

                        <label for="location">Preferred Collection Location:</label>

                        <select id="location" name="location" required>

                            <option value="">Select a location</option>
                            <option value="Pretoria Central">Pretoria Central</option>
                            <option value="Sunnyside">Sunnyside</option>

                        </select>

                        <label for="date">Preferred Date:</label>

                        <input
                            type="date"
                            id="date"
                            name="date"
                            required
                        >

                        <label for="quantity">Number of Items:</label>

                        <input
                            type="number"
                            id="quantity"
                            name="quantity"
                            min="1"
                            max="100"
                            required
                        >

                        <label for="message">Enquiry Message:</label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            minlength="10"
                            maxlength="500"
                            placeholder="Tell us more about the product or service you need..."
                            required
                        ></textarea>

                    </fieldset>

                    <!-- Form buttons -->
                    <button type="submit" class="btn">
                        Submit Enquiry
                    </button>

                    <button type="reset" class="btn">
                        Clear Form
                    </button>

                </form>

                <!-- JavaScript response appears here -->
                <div id="enquiryResponse" aria-live="polite"></div>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Rea's Bakery. All rights reserved.</p>
        <p>Freshly Baked. Made with Love.</p>
    </footer>

    <script src="_js/script.js"></script>

</body>
</html>
```
